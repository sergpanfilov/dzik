<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dzik czyta</title>
<meta name="description" content="Dzik czyta — codzienny trening uważnego czytania po polsku z dzikiem Bączkiem.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=Lexend:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="img/baczek/idle.webp">
</head>
<body>
<canvas id="confetti" hidden></canvas>
<div id="splash" role="dialog" aria-label="Dzik czyta">
  <div class="rays"></div>
  <div class="floaters" aria-hidden="true">
    <span style="--x:8%;--d:0s;--r:-12deg">A</span><span style="--x:22%;--d:1.4s;--r:9deg">ą</span><span style="--x:36%;--d:.7s;--r:-6deg">?</span><span style="--x:52%;--d:2.1s;--r:14deg">ż</span><span style="--x:66%;--d:.3s;--r:-9deg">!</span><span style="--x:80%;--d:1.8s;--r:7deg">ł</span><span style="--x:92%;--d:1s;--r:-15deg">,</span><span style="--x:14%;--d:2.6s;--r:11deg">ś</span><span style="--x:46%;--d:3.1s;--r:-4deg">★</span><span style="--x:74%;--d:2.4s;--r:5deg">★</span>
  </div>
  <div class="cover">
    <p class="kicker">Trening czytania z dzikiem</p>
    <h1 class="big">BĄCZEK</h1>
    <p class="strip">czytaj uważnie, zbieraj gwiazdki</p>
    <div class="cover-pig"><img class="cover-cloud" src="img/baczek/cloud2.webp" alt=""><img src="img/baczek/book.webp" alt=""><span class="pow" id="splashEp">odcinek 1</span><span class="bubble-c">Przeczytaj i odpowiedz!</span></div>
    <p class="what">Codziennie jedna historia, pytania, znaki i kolejność wydarzeń. Około 12 minut.</p>
    <button class="start" id="splashStart">START</button>
  </div>
</div>
<div class="wrap">
  <header class="top">
    <a class="brand" href="./"><span class="mini"><img src="img/baczek/idle.webp" alt=""></span><h1>Dzik czyta</h1></a>
    <div class="top-right">
      <span class="font-ctl" role="group" aria-label="Wielkość liter"><button class="ib" id="fontMinus" title="Mniejsze litery">A−</button><button class="ib" id="fontPlus" title="Większe litery">A+</button></span>
      <button class="ib" id="themeBtn" title="Jasno / ciemno" aria-label="Jasno / ciemno"></button>
      <button class="ib" id="soundBtn" title="Dźwięk" aria-label="Dźwięk"></button>
      <span class="who" id="who" hidden></span>
      <button class="gbtn" id="loginBtn" hidden>Zaloguj przez Google</button>
      <button class="ghost" id="logoutBtn" hidden>Wyloguj</button>
    </div>
  </header>

  <section class="mascot" id="mascot">
    <div class="boar-box" id="boarBox"></div>
    <div class="bubble" id="bubble">Cześć!</div>
  </section>

  <main id="stage" class="wrap" style="gap:16px"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="texts.js"></script>
<script src="baczek.js"></script>
<script src="app.js"></script>
</body>
</html>
